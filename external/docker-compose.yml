version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ELK Stack with Filebeat  ·  Multi-product / Multi-service / Multi-env
# ─────────────────────────────────────────────────────────────────────────────
#
#  Log path convention (used by Filebeat autodiscovery):
#    ./logs/<environment>/<product>/<service>/app.log
#
#  Example:
#    ./logs/dev/product-a/auth-service/app.log
#    ./logs/prod/product-b/payment-service/app.log
# ─────────────────────────────────────────────────────────────────────────────

x-elk-common: &elk-common
  networks:
    - elk
  restart: unless-stopped

services:


  # ── Filebeat ─────────────────────────────────────────────────────────────
  # Filebeat harvests log files from the shared ./logs volume and ships
  # them to Logstash.  It extracts product / service / environment from
  # the file path using a regex processor.
  filebeat_external_service_a:
    <<: *elk-common
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
    container_name: elk_filebeat_external_service_a
    user: root  # required to read other containers' log files
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - LOGSTASH_HOST=172.20.0.5:5044
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro                  # all service logs land here
      - filebeat_data:/usr/share/filebeat/data
      # Optional: also ship Docker container stdout logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: filebeat -e -strict.perms=false
    healthcheck:
      test: ["CMD-SHELL", "filebeat test config -e"]
      interval: 30s
      timeout: 10s
      retries: 5


  # product-a · api-service · dev
  product-a-api-dev-external:
    <<: *elk-common
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: product_a_api_dev_external
    environment:
      - PRODUCT=product-a-external
      - SERVICE=api-service
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
      - LOGSTASH_HOST=172.20.0.5
      - LOGSTASH_PORT=5000
    volumes:
      - ./logs/dev/product-a/api-service:/app/logs
    command: python examples/product_a_api.py



networks:
  elk:
    driver: bridge
    name: external_elk_network

volumes:
  filebeat_data:
    driver: local
